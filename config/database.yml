# PostgreSQL rodando em container (ver docker-compose.yml na raiz do projeto).
# Host, porta, usuário e senha vêm do ambiente para não travar o setup de
# ninguém; os defaults batem com o compose.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= ENV.fetch("DENFIS_DATABASE_HOST", "localhost") %>
  port:     <%= ENV.fetch("DENFIS_DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DENFIS_DATABASE_USER", "denfis") %>
  password: <%= ENV.fetch("DENFIS_DATABASE_PASSWORD", "denfis") %>

# DENFIS_DATABASE_NAME troca o banco sem mexer neste arquivo. É o que o
# bin/share usa para gravar os testadores num banco só do protótipo, e não no
# de desenvolvimento — assim o pg_dump dele sai limpo para subir no servidor.
development:
  <<: *default
  database: <%= ENV.fetch("DENFIS_DATABASE_NAME", "denfis_development") %>

test:
  <<: *default
  database: denfis_test

production:
  <<: *default
  database: denfis_production
  password: <%= ENV["DENFIS_DATABASE_PASSWORD"] %>

# Versão de Windows (packaging/windows): um Postgres portátil por instalação,
# na porta e com a senha que o lançador sorteia no primeiro uso.
desktop:
  <<: *default
  database: denfis_desktop
  password: <%= ENV["DENFIS_DATABASE_PASSWORD"] %>
