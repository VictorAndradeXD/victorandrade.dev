    work:
      title: Selected work
      note: Three projects, in depth

    projects:
      konverta:
        name: Konverta
        kind: Software Engineer (Contract) · Sep 2025 – Present
        summary: Multi-tenant CRM and WhatsApp/AI automation platform for the Brazilian fitness industry, running 30+ live gym tenants.
        highlights:
          - Own delivery end to end — CRM pipelines, automation engine, staged dunning and analytics — across a NestJS backend and a React + Vite frontend.
          - BullMQ cron/worker pipelines with concurrency gating, missed-run detection and dedupe locks; multi-tenant SQL with a mandatory dry-run before any write.
          - Asaas billing behind Redis distributed locks, plus WhatsApp providers, Meta Graph, Google Calendar and Auth0.
          - "Production LLM SDR agents: prompt design, evaluation across the GPT-4.1/5.1 family, and guardrails against prompt leakage."
          - Encryption at rest for tenant access tokens (AES-256-GCM + argon2id) and read-only production diagnostics.
      feirinha:
        name: Feirinha Verde
        kind: Full-Stack Developer (Contract) · May – Aug 2026
        summary: Fair and event management platform with paid space sales — exhibitor registration, stand and seat map, online checkout and an admin panel. Delivered end to end.
        highlights:
          - Java 21 + Spring Boot 4 REST API with Spring Data JPA and Bean Validation; auth via Spring Security + JWT and Bucket4j rate limiting.
          - Asaas checkout and webhooks driving seat and reservation control, on PostgreSQL with versioned Flyway migrations.
          - S3-compatible object storage (Cloudflare R2), transactional email, PDF/CSV reporting and OpenAPI docs.
          - "Test discipline: JUnit 5, Testcontainers, ArchUnit, REST Assured, Gatling load tests and JaCoCo coverage, gated in GitHub Actions."
          - Angular 21 SPA with standalone components and Playwright end-to-end coverage.
      denfis:
        name: Denfis
        kind: Personal project · Open source (MIT)
        summary: A dark-first personal finance manager on Rails 8 — and one module of the site you are reading right now.
        highlights:
          - Card statements modeled as a parent transaction broken into detail lines, with the remainder left undescribed and the sum constrained to never exceed the parent.
          - Recurring rules and installment plans, a per-day balance calendar and a printable statement with its own print stylesheet.
          - Rails 8 with Hotwire and import maps — no build step for JavaScript — over PostgreSQL, with Argon2id password hashing.
          - Runtime theming through CSS custom properties, so dark and light swap without recompiling Tailwind.

