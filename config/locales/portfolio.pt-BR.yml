    projects:
      konverta:
        name: Konverta
        kind: Engenheiro de Software (Contrato) · Set 2025 – Atual
        summary: Plataforma multi-tenant de CRM e automação por WhatsApp/IA para o setor fitness brasileiro, rodando com mais de 30 academias ativas.
        highlights:
          - Entrega de ponta a ponta — pipelines de CRM, motor de automação, régua de cobrança e analytics — entre um backend NestJS e um frontend React + Vite.
          - Pipelines de cron e workers com BullMQ, com controle de concorrência, detecção de execução perdida e locks de dedupe; SQL multi-tenant com dry-run obrigatório antes de qualquer escrita.
          - Cobrança via Asaas protegida por locks distribuídos no Redis, além de provedores de WhatsApp, Meta Graph, Google Calendar e Auth0.
          - "Agentes LLM de SDR em produção: desenho de prompts, avaliação na família GPT-4.1/5.1 e guardrails contra vazamento de prompt."
          - Criptografia em repouso dos tokens de acesso dos tenants (AES-256-GCM + argon2id) e diagnóstico somente-leitura em produção.
      feirinha:
        name: Feirinha Verde
        kind: Desenvolvedor Full-Stack (Contrato) · Mai – Ago 2026
        summary: Plataforma de gestão de feiras e eventos com venda de espaços — cadastro de expositores, mapa de estandes e assentos, checkout online e painel administrativo. Entregue ponta a ponta.
        highlights:
          - API REST em Java 21 + Spring Boot 4 com Spring Data JPA e Bean Validation; autenticação com Spring Security + JWT e rate limiting com Bucket4j.
          - Checkout e webhooks do Asaas controlando reservas e assentos, sobre PostgreSQL com migrations versionadas no Flyway.
          - Object storage compatível com S3 (Cloudflare R2), e-mails transacionais, relatórios em PDF/CSV e documentação OpenAPI.
          - "Disciplina de teste: JUnit 5, Testcontainers, ArchUnit, REST Assured, testes de carga com Gatling e cobertura JaCoCo, barrados no GitHub Actions."
          - SPA em Angular 21 com standalone components e cobertura ponta a ponta com Playwright.
      denfis:
        name: Denfis
        kind: Projeto pessoal · Código aberto (MIT)
        summary: Um gerenciador de finanças pessoais dark-first em Rails 8 — e um dos módulos do site que você está lendo agora.
        highlights:
          - Fatura de cartão modelada como um lançamento pai quebrado em linhas de detalhe, com o restante sem descrição e a soma impedida de ultrapassar o pai.
          - Recorrências e parcelamentos, calendário de saldo por dia e um extrato imprimível com folha de estilo própria para papel.
          - Rails 8 com Hotwire e import maps — sem etapa de build para JavaScript — sobre PostgreSQL, com hash de senha em Argon2id.
          - Tema trocado em tempo de execução por custom properties do CSS, então claro e escuro alternam sem recompilar o Tailwind.

