<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>Sem conexão — Denfis</title>
  <!-- Estilo embutido: esta página é servida do cache do service worker,
       sem rede, então não pode depender do CSS do app. -->
  <style>
    /* Mesma regra do app: escuro sempre, claro só quem escolheu no botão de
       tema (o mesmo localStorage, já que a origem é a mesma). */
    :root { color-scheme: dark; --canvas: #0b0f14; --surface: #131a22; --hairline: #24303d; --ink: #e6edf3; --muted: #8b9bab; --brand: #818cf8; --on-brand: #0b0f14; }
    :root[data-theme="light"] { color-scheme: light; --canvas: #f5f7fa; --surface: #ffffff; --hairline: #dde3ec; --ink: #111927; --muted: #5b6b7f; --brand: #4f46e5; --on-brand: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--canvas); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 22rem; text-align: center; background: var(--surface);
           border: 1px solid var(--hairline); border-radius: 16px; padding: 32px 24px; }
    .mark { color: var(--brand); font-size: 28px; line-height: 1; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
             background: var(--brand); color: var(--on-brand); cursor: pointer; }
  </style>
  <script>
    try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light" } catch (e) {}
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◆</div>
    <h1>Sem conexão</h1>
    <p>O Denfis precisa de internet para mostrar seus dados. Assim que a conexão voltar, tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
