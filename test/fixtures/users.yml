<%#
  Custo mínimo de propósito: os parâmetros do Argon2 ficam gravados no próprio
  digest, então a verificação continua funcionando, e a suíte não paga 200ms de
  hash por fixture a cada execução.
%>
<% password_digest = Argon2::Password.new(t_cost: 1, m_cost: 10, p_cost: 1).create("password") %>

one:
  email_address: one@example.com
  password_digest: <%= password_digest %>

two:
  email_address: two@example.com
  password_digest: <%= password_digest %>

# A contadora não tem acesso ao Denfis, e é isso que os testes de autorização
# verificam. Por existir esta fixture, os testes usam users(:one) em vez de
# User.take: o take é não-determinístico e às vezes devolveria ela.
contadora:
  email_address: contadora@example.com
  password_digest: <%= password_digest %>
  denfis_access: false
  accounting_access: true
